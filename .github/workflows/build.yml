name: Compilar Kernel Redmi Note 9 (MIUI 13)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Descargar Código Base
      uses: actions/checkout@v4

    - name: Preparar Entorno y Herramientas GCC/Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lld

    - name: Descargar Toolchain Proton-Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

    - name: Compilar Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Forzar enlazador del sistema para evitar incompatibilidad con libc.so.6
        export LD=ld.lld
        
        # 1. Configurar la placa (genera el .config necesario)
        if [ -f arch/arm64/configs/merlinx_defconfig ]; then
          make merlinx_defconfig
        elif [ -f arch/arm64/configs/merlin_defconfig ]; then
          make merlin_defconfig
        else
          make mt6768_defconfig
        fi
        
        # 2. Compilar
        make -j$(nproc --all)

    - name: Empaquetar con AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Kernel-Merlin-MIUI13.zip *

    - name: Subir Archivo ZIP Resultante
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-RedmiNote9-MIUI13
        path: Kernel-Merlin-MIUI13.zip
